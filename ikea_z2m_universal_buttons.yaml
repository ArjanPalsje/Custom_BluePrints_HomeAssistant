    type: action
    subtype: "toggle"
    id: "power_toggle"

  - trigger: device
    domain: mqtt
    device_id: !input ikea_button
    type: action
    subtype: "on_double"
    id: "power_on_double"

  - trigger: device
    domain: mqtt
    device_id: !input ikea_button
    type: action
    subtype: "off_double"
    id: "power_off_double"

  - trigger: device
    domain: mqtt
    device_id: !input ikea_button
    type: action
    subtype: "brightness_step_up"
    id: "dim_up_tap"

  - trigger: device
    domain: mqtt
    device_id: !input ikea_button
