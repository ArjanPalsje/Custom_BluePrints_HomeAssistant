          - choose: []
            default: !input action_volume_up_hold

      - conditions: "{{ trigger.id == 'volume_down_hold' }}"
        sequence:
          - choose: []
            default: !input action_any
          - choose: []
            default: !input action_volume_down_hold

      - conditions: "{{ trigger.id == 'open' }}"
        sequence:
          - choose: []
            default: !input action_any
          - choose: []
            default: !input action_open

      - conditions: "{{ trigger.id == 'close' }}"
        sequence:
          - choose: []
            default: !input action_any
          - choose: []
            default: !input action_close

      - conditions: "{{ trigger.id == 'stop' }}"
        sequence:
          - choose: []
            default: !input action_any
          - choose: []
            default: !input action_stop

mode: parallel
max: 20
max_exceeded: silent
