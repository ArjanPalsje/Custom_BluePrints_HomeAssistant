blueprint:
  name: IKEA knoppen universeel - Zigbee2MQTT device selector
  description: >
    Universele blueprint voor IKEA knoppen/remotes via Zigbee2MQTT.
    Deze versie gebruikt een dropdown met MQTT-devices in plaats van een handmatig MQTT-topic.

    Kies bij het maken van de automation je IKEA knop uit de dropdown.
    Let op: Zigbee2MQTT maakt sommige action-triggers pas zichtbaar nadat je de knop minimaal één keer hebt ingedrukt.

    Geschikt voor o.a. TRADFRI, STYRBAR, RODRET, SOMRIG, SYMFONISK,
    open/close remotes en BILRESA/E2489 in Zigbee-modus.

  domain: automation

  input:
    ikea_button:
      name: IKEA Zigbee2MQTT knop
      description: "Kies hier je IKEA knop uit de MQTT devices."
      selector:
        device:
          filter:
            - integration: mqtt

    action_any:
      name: Elke knopactie
      description: "Wordt uitgevoerd bij elke ondersteunde ontvangen actie."
      default: []
      selector:
        action: {}

    action_on:
      name: ON / boven / aan
      description: "Action: on"
      default: []
      selector:
        action: {}

    action_off:
      name: OFF / onder / uit
      description: "Action: off"
      default: []
      selector:
        action: {}

    action_on_double:
      name: ON dubbelklik
      description: "Action: on_double"
      default: []
      selector:
        action: {}

    action_off_double:
      name: OFF dubbelklik
      description: "Action: off_double"
      default: []
      selector:
        action: {}

    action_toggle:
      name: Toggle / middenknop
      description: "Action: toggle"
      default: []
      selector:
        action: {}

    action_toggle_hold:
      name: Toggle lang ingedrukt
      description: "Action: toggle_hold"
      default: []
      selector:
        action: {}

    action_brightness_move_up:
      name: Helderheid omhoog vasthouden
      description: "Action: brightness_move_up"
      default: []
      selector:
        action: {}

    action_brightness_move_down:
      name: Helderheid omlaag vasthouden
      description: "Action: brightness_move_down"
      default: []
      selector:
        action: {}

    action_brightness_stop:
      name: Helderheid stoppen / losgelaten
      description: "Action: brightness_stop"
      default: []
      selector:
        action: {}

    action_brightness_step_up:
      name: Helderheid stap omhoog
      description: "Action: brightness_step_up"
      default: []
      selector:
        action: {}

    action_brightness_step_down:
      name: Helderheid stap omlaag
      description: "Action: brightness_step_down"
      default: []
      selector:
        action: {}

    action_brightness_move_to_level:
      name: Helderheid naar niveau / scrollwaarde
      description: "Action: brightness_move_to_level"
      default: []
      selector:
        action: {}

    action_brightness_up_click:
      name: Helderheid omhoog klik
      description: "Action: brightness_up_click"
      default: []
