conditions: []

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ true }}"
        sequence: !input action_any

  - choose:
      - conditions:
          - condition: trigger
            id: "power_on"
        sequence: !input action_power_on

      - conditions:
          - condition: trigger
            id: "power_off"
        sequence: !input action_power_off

      - conditions:
          - condition: trigger
            id: "power_toggle"
        sequence: !input action_power_toggle

      - conditions:
          - condition: trigger
            id: "power_on_double"
        sequence: !input action_power_on_double

      - conditions:
          - condition: trigger
            id: "power_off_double"
        sequence: !input action_power_off_double

      - conditions:
          - condition: trigger
            id: "dim_up_tap"
        sequence: !input action_dim_up_tap

      - conditions:
          - condition: trigger
            id: "dim_down_tap"
        sequence: !input action_dim_down_tap

      - conditions:
          - condition: trigger
            id: "dim_level"
        sequence: !input action_dim_level

      - conditions:
          - condition: trigger
            id: "left_tap"
        sequence: !input action_left_tap

      - conditions:
          - condition: trigger
            id: "right_tap"
        sequence: !input action_right_tap

      - conditions:
          - condition: trigger
            id: "button_1_tap"
        sequence: !input action_button_1_tap

      - conditions:
          - condition: trigger
            id: "button_1_double"
        sequence: !input action_button_1_double

      - conditions:
          - condition: trigger
            id: "button_2_tap"
        sequence: !input action_button_2_tap

      - conditions:
          - condition: trigger
            id: "button_2_double"
        sequence: !input action_button_2_double

      - conditions:
          - condition: trigger
            id: "media_previous"
        sequence: !input action_media_previous

      - conditions:
          - condition: trigger
            id: "media_next"
        sequence: !input action_media_next

      - conditions:
          - condition: trigger
            id: "volume_up"
        sequence: !input action_volume_up

      - conditions:
          - condition: trigger
            id: "volume_down"
        sequence: !input action_volume_down

      - conditions:
          - condition: trigger
            id: "volume_up_hold"
        sequence: !input action_volume_up_hold

      - conditions:
          - condition: trigger
            id: "volume_down_hold"
        sequence: !input action_volume_down_hold

      - conditions:
          - condition: trigger
            id: "open"
        sequence: !input action_open

      - conditions:
          - condition: trigger
            id: "close"
        sequence: !input action_close

      - conditions:
          - condition: trigger
            id: "stop"
        sequence: !input action_stop

      - conditions:
          - condition: trigger
            id: "dim_up_hold"
        sequence:
          - repeat:
              count: !input hold_loop_max
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ true }}"
                      sequence: !input action_dim_up_hold_loop

                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "brightness_stop"

                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "brightness_up_release"
                  timeout:
                    milliseconds: "{{ hold_loop_delay_ms | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - stop: "Knop losgelaten"

      - conditions:
          - condition: trigger
            id: "dim_down_hold"
        sequence:
          - repeat:
              count: !input hold_loop_max
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ true }}"
                      sequence: !input action_dim_down_hold_loop

                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "brightness_stop"

                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "brightness_down_release"
                  timeout:
                    milliseconds: "{{ hold_loop_delay_ms | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - stop: "Knop losgelaten"

      - conditions:
          - condition: trigger
            id: "left_hold"
        sequence:
          - repeat:
              count: !input hold_loop_max
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ true }}"
                      sequence: !input action_left_hold_loop

                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "arrow_left_release"
                  timeout:
                    milliseconds: "{{ hold_loop_delay_ms | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - stop: "Knop losgelaten"

      - conditions:
          - condition: trigger
            id: "right_hold"
        sequence:
          - repeat:
              count: !input hold_loop_max
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ true }}"
                      sequence: !input action_right_hold_loop

                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "arrow_right_release"
                  timeout:
                    milliseconds: "{{ hold_loop_delay_ms | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - stop: "Knop losgelaten"

      - conditions:
          - condition: trigger
            id: "button_1_hold"
        sequence:
          - repeat:
              count: !input hold_loop_max
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ true }}"
                      sequence: !input action_button_1_hold_loop

                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "1_long_release"

                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "dots_1_long_release"
                  timeout:
                    milliseconds: "{{ hold_loop_delay_ms | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - stop: "Knop losgelaten"

      - conditions:
          - condition: trigger
            id: "button_2_hold"
        sequence:
          - repeat:
              count: !input hold_loop_max
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ true }}"
                      sequence: !input action_button_2_hold_loop

                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "2_long_release"

                    - trigger: device
                      domain: mqtt
                      device_id: !input ikea_button
                      type: action
                      subtype: "dots_2_long_release"
                  timeout:
                    milliseconds: "{{ hold_loop_delay_ms | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - stop: "Knop losgelaten"

mode: restart
max_exceeded: silent
