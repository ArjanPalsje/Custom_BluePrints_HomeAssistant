blueprint:
  name: IKEA knoppen universeel - Zigbee2MQTT
  description: >
    Universele blueprint voor IKEA knoppen/remotes via Zigbee2MQTT.

    Deze blueprint gebruikt een MQTT-device dropdown. Kies je IKEA knop uit de lijst.
    De opties zijn gegroepeerd per soort knop, omdat Home Assistant blueprint-velden
    niet dynamisch kan verbergen of tonen op basis van het gekozen device.

    Hold/vasthoud-acties worden herhaald in een loop. De loop stopt zodra de bijbehorende
    release/stop-action binnenkomt, of zodra het ingestelde maximum aantal loops is bereikt.

    Werkt voor veel IKEA Zigbee2MQTT knoppen/remotes, zoals RODRET, TRADFRI, STYRBAR,
    SOMRIG, SYMFONISK, open/close remotes en BILRESA/E2489 in Zigbee-modus.

    Let op: Zigbee2MQTT/Home Assistant maakt sommige MQTT device triggers pas zichtbaar
    nadat je die specifieke knopactie minimaal één keer hebt gebruikt.

  domain: automation

  homeassistant:
    min_version: "2024.6.0"

  input:
    basis:
      name: Basis
      icon: mdi:remote
      input:
        ikea_button:
          name: IKEA Zigbee2MQTT knop
          description: "Kies hier je IKEA knop uit de MQTT devices."
          selector:
            device:
              filter:
                - integration: mqtt

        hold_loop_delay_ms:
          name: Delay tussen loops bij vasthouden
          description: "Hoe snel de actie zich herhaalt zolang je de knop ingedrukt houdt."
          default: 300
          selector:
            number:
              min: 50
              max: 2000
              step: 50
              mode: slider
              unit_of_measurement: ms

        hold_loop_max:
          name: Maximum aantal loops
          description: "Veiligheidslimiet. De loop stopt eerder zodra je de knop loslaat."
          default: 40
          selector:
            number:
              min: 1
              max: 200
              step: 1
              mode: slider

        action_any:
          name: Elke knopactie
          description: "Wordt één keer uitgevoerd bij elke herkende knopactie. Handig voor logging."
          default: []
          selector:
            action: {}

    aan_uit:
      name: Aan/uit en toggle
      icon: mdi:power
      collapsed: false
      input:
        action_power_on:
          name: Aan / boven / ON
          description: "Voor acties zoals: on"
          default: []
          selector:
            action: {}

        action_power_off:
          name: Uit / onder / OFF
          description: "Voor acties zoals: off"
          default: []
          selector:
            action: {}

        action_power_toggle:
          name: Toggle / middenknop
          description: "Voor acties zoals: toggle"
          default: []
          selector:
            action: {}

        action_power_on_double:
          name: Aan dubbelklik
          description: "Voor acties zoals: on_double"
          default: []
          selector:
            action: {}

        action_power_off_double:
          name: Uit dubbelklik
          description: "Voor acties zoals: off_double"
          default: []
          selector:
            action: {}

    dimmen_scrollen:
      name: Dimmen / scrollwiel
      icon: mdi:brightness-6
      collapsed: false
      input:
        action_dim_up_tap:
          name: Dimmen omhoog - klik/stap
          description: "Voor acties zoals: brightness_step_up, brightness_up_click"
          default: []
          selector:
            action: {}

        action_dim_down_tap:
          name: Dimmen omlaag - klik/stap
          description: "Voor acties zoals: brightness_step_down, brightness_down_click"
          default: []
          selector:
            action: {}

        action_dim_up_hold_loop:
          name: Dimmen omhoog - vasthouden/scrollen
          description: "Wordt herhaald tot brightness_stop of brightness_up_release binnenkomt."
          default: []
          selector:
            action: {}

        action_dim_down_hold_loop:
          name: Dimmen omlaag - vasthouden/scrollen
          description: "Wordt herhaald tot brightness_stop of brightness_down_release binnenkomt."
          default: []
          selector:
            action: {}

        action_dim_level:
          name: Dimmen naar niveau / scrollwaarde
          description: "Voor acties zoals: brightness_move_to_level"
          default: []
          selector:
            action: {}

    pijlen:
      name: Pijlen links/rechts
      icon: mdi:arrow-left-right
      collapsed: true
      input:
        action_left_tap:
          name: Links klik
          description: "Voor acties zoals: arrow_left_click"
          default: []
          selector:
            action: {}

        action_right_tap:
          name: Rechts klik
          description: "Voor acties zoals: arrow_right_click"
          default: []
          selector:
            action: {}

        action_left_hold_loop:
          name: Links vasthouden
          description: "Wordt herhaald tot arrow_left_release binnenkomt."
          default: []
          selector:
            action: {}

        action_right_hold_loop:
          name: Rechts vasthouden
          description: "Wordt herhaald tot arrow_right_release binnenkomt."
          default: []
          selector:
            action: {}

    twee_knoppen:
      name: Twee-knops acties
      icon: mdi:dots-horizontal
      collapsed: true
      input:
        action_button_1_tap:
          name: Knop 1 kort
          description: "Voor acties zoals: 1_short_release, dots_1_short_release"
          default: []
          selector:
            action: {}

        action_button_1_double:
          name: Knop 1 dubbelklik
          description: "Voor acties zoals: 1_double_press, dots_1_double_press"
          default: []
          selector:
            action: {}

        action_button_1_hold_loop:
          name: Knop 1 vasthouden
          description: "Wordt herhaald tot 1_long_release of dots_1_long_release binnenkomt."
          default: []
          selector:
            action: {}

        action_button_2_tap:
          name: Knop 2 kort
          description: "Voor acties zoals: 2_short_release, dots_2_short_release"
          default: []
          selector:
            action: {}

        action_button_2_double:
          name: Knop 2 dubbelklik
          description: "Voor acties zoals: 2_double_press, dots_2_double_press"
          default: []
          selector:
            action: {}

        action_button_2_hold_loop:
          name: Knop 2 vasthouden
          description: "Wordt herhaald tot 2_long_release of dots_2_long_release binnenkomt."
          default: []
          selector:
            action: {}

    media:
      name: Media / SYMFONISK
      icon: mdi:music
      collapsed: true
      input:
        action_media_previous:
          name: Vorige track
          description: "Voor acties zoals: track_previous"
          default: []
          selector:
            action: {}

        action_media_next:
          name: Volgende track
          description: "Voor acties zoals: track_next"
          default: []
          selector:
            action: {}

        action_volume_up:
          name: Volume omhoog
          description: "Voor acties zoals: volume_up"
          default: []
          selector:
            action: {}

        action_volume_down:
          name: Volume omlaag
          description: "Voor acties zoals: volume_down"
          default: []
          selector:
            action: {}

        action_volume_up_hold:
          name: Volume omhoog vasthouden
          description: "Voor acties zoals: volume_up_hold. Geen loop, omdat Zigbee2MQTT hiervoor meestal geen release-action geeft."
          default: []
          selector:
            action: {}

        action_volume_down_hold:
          name: Volume omlaag vasthouden
          description: "Voor acties zoals: volume_down_hold. Geen loop, omdat Zigbee2MQTT hiervoor meestal geen release-action geeft."
          default: []
          selector:
            action: {}

    open_close:
      name: Open / close remote
      icon: mdi:window-shutter
      collapsed: true
      input:
        action_open:
          name: Open
          description: "Voor acties zoals: open"
          default: []
          selector:
            action: {}

        action_close:
          name: Close
          description: "Voor acties zoals: close"
          default: []
          selector:
            action: {}

        action_stop:
          name: Stop
          description: "Voor acties zoals: stop"
          default: []
          selector:
            action: {}

