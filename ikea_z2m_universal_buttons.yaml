blueprint:
  name: IKEA knoppen universeel - Zigbee2MQTT
  description: >
    Universele blueprint voor IKEA knoppen/remotes via Zigbee2MQTT.
    Werkt op basis van de MQTT action uit het Zigbee2MQTT state topic.
    Geschikt voor o.a. TRADFRI, STYRBAR, RODRET, SOMRIG, SYMFONISK,
    open/close remotes en BILRESA/E2489 in Zigbee-modus.

    Gebruik per fysieke knop één automation met deze blueprint.
    Vul als topic in: zigbee2mqtt/FRIENDLY_NAME

  domain: automation

  input:
    z2m_topic:
      name: Zigbee2MQTT topic
      description: >
        Vul het state-topic van je IKEA knop in.
        Gebruik NIET /set.
        Voorbeeld: zigbee2mqtt/ikea_knop_woonkamer
      selector:
        text:

    action_any:
      name: Elke knopactie
      description: "Wordt uitgevoerd bij elke ontvangen action. Handig voor logging of debugging."
      default: []
      selector:
        action: {}

    action_on:
      name: ON / boven / aan
      description: "Raw action: on"
      default: []
      selector:
        action: {}

    action_off:
      name: OFF / onder / uit
      description: "Raw action: off"
      default: []
      selector:
        action: {}

    action_on_double:
      name: ON dubbelklik
      description: "Raw action: on_double"
      default: []
      selector:
        action: {}

    action_off_double:
      name: OFF dubbelklik
      description: "Raw action: off_double"
      default: []
      selector:
        action: {}

    action_toggle:
      name: Toggle / middenknop / play-pause
      description: "Raw action: toggle"
      default: []
      selector:
        action: {}

    action_toggle_hold:
      name: Toggle lang ingedrukt
      description: "Raw action: toggle_hold"
      default: []
      selector:
        action: {}

    action_brightness_move_up:
      name: Helderheid omhoog vasthouden
      description: "Raw action: brightness_move_up"
      default: []
      selector:
        action: {}

    action_brightness_move_down:
      name: Helderheid omlaag vasthouden
      description: "Raw action: brightness_move_down"
      default: []
      selector:
        action: {}

    action_brightness_stop:
      name: Helderheid stoppen / losgelaten
      description: "Raw action: brightness_stop"
      default: []
      selector:
        action: {}

    action_brightness_step_up:
      name: Helderheid stap omhoog
      description: "Raw action: brightness_step_up"
      default: []
      selector:
        action: {}

    action_brightness_step_down:
      name: Helderheid stap omlaag
      description: "Raw action: brightness_step_down"
      default: []
      selector:
        action: {}

    action_brightness_move_to_level:
      name: Helderheid naar niveau / scrollwaarde
      description: "Raw action: brightness_move_to_level"
      default: []
      selector:
        action: {}

    action_brightness_up_click:
      name: Helderheid omhoog klik
      description: "Raw action: brightness_up_click"
      default: []
      selector:
        action: {}

    action_brightness_up_hold:
      name: Helderheid omhoog lang ingedrukt
      description: "Raw action: brightness_up_hold"
      default: []
      selector:
        action: {}

    action_brightness_up_release:
      name: Helderheid omhoog losgelaten
      description: "Raw action: brightness_up_release"
      default: []
      selector:
        action: {}

    action_brightness_down_click:
      name: Helderheid omlaag klik
      description: "Raw action: brightness_down_click"
      default: []
      selector:
        action: {}

    action_brightness_down_hold:
      name: Helderheid omlaag lang ingedrukt
      description: "Raw action: brightness_down_hold"
      default: []
      selector:
        action: {}

    action_brightness_down_release:
      name: Helderheid omlaag losgelaten
      description: "Raw action: brightness_down_release"
      default: []
      selector:
        action: {}

    action_arrow_left_click:
      name: Pijl links klik
      description: "Raw action: arrow_left_click"
      default: []
      selector:
        action: {}

    action_arrow_left_hold:
      name: Pijl links lang ingedrukt
      description: "Raw action: arrow_left_hold"
      default: []
      selector:
        action: {}

    action_arrow_left_release:
      name: Pijl links losgelaten
      description: "Raw action: arrow_left_release"
      default: []
      selector:
        action: {}

    action_arrow_right_click:
      name: Pijl rechts klik
      description: "Raw action: arrow_right_click"
      default: []
      selector:
        action: {}

    action_arrow_right_hold:
      name: Pijl rechts lang ingedrukt
      description: "Raw action: arrow_right_hold"
      default: []
      selector:
        action: {}

    action_arrow_right_release:
      name: Pijl rechts losgelaten
      description: "Raw action: arrow_right_release"
      default: []
      selector:
        action: {}

    action_button_1_initial_press:
      name: Knop 1 eerste druk
      description: "Raw actions: 1_initial_press, dots_1_initial_press"
      default: []
      selector:
        action: {}

    action_button_1_short_release:
      name: Knop 1 kort losgelaten
      description: "Raw actions: 1_short_release, dots_1_short_release"
      default: []
      selector:
        action: {}

    action_button_1_long_press:
      name: Knop 1 lang ingedrukt
      description: "Raw actions: 1_long_press, dots_1_long_press"
      default: []
      selector:
        action: {}

    action_button_1_long_release:
      name: Knop 1 lang losgelaten
      description: "Raw actions: 1_long_release, dots_1_long_release"
      default: []
      selector:
        action: {}

    action_button_1_double_press:
      name: Knop 1 dubbelklik
      description: "Raw actions: 1_double_press, dots_1_double_press"
      default: []
      selector:
        action: {}

    action_button_2_initial_press:
      name: Knop 2 eerste druk
      description: "Raw actions: 2_initial_press, dots_2_initial_press"
      default: []
      selector:
        action: {}

    action_button_2_short_release:
      name: Knop 2 kort losgelaten
      description: "Raw actions: 2_short_release, dots_2_short_release"
      default: []
      selector:
        action: {}

    action_button_2_long_press:
      name: Knop 2 lang ingedrukt
      description: "Raw actions: 2_long_press, dots_2_long_press"
      default: []
      selector:
        action: {}

    action_button_2_long_release:
      name: Knop 2 lang losgelaten
      description: "Raw actions: 2_long_release, dots_2_long_release"
      default: []
      selector:
        action: {}

    action_button_2_double_press:
      name: Knop 2 dubbelklik
      description: "Raw actions: 2_double_press, dots_2_double_press"
      default: []
      selector:
        action: {}

    action_track_previous:
      name: Vorige track / vorige scène
      description: "Raw action: track_previous"
      default: []
      selector:
        action: {}

    action_track_next:
      name: Volgende track / volgende scène
      description: "Raw action: track_next"
      default: []
      selector:
        action: {}

    action_volume_up:
      name: Volume omhoog
      description: "Raw action: volume_up"
      default: []
      selector:
        action: {}

    action_volume_down:
      name: Volume omlaag
      description: "Raw action: volume_down"
      default: []
      selector:
        action: {}

    action_volume_up_hold:
      name: Volume omhoog vasthouden
      description: "Raw action: volume_up_hold"
      default: []
      selector:
        action: {}

    action_volume_down_hold:
      name: Volume omlaag vasthouden
      description: "Raw action: volume_down_hold"
      default: []
      selector:
        action: {}

    action_open:
      name: Open
      description: "Raw action: open"
      default: []
      selector:
        action: {}

    action_close:
      name: Close
      description: "Raw action: close"
      default: []
      selector:
        action: {}

    action_stop:
      name: Stop
      description: "Raw action: stop"
      default: []
      selector:
        action: {}

    action_unknown:
      name: Onbekende/niet-gekoppelde action
      description: >
        Wordt uitgevoerd als er een action binnenkomt die niet hierboven staat.
        Handig om nieuwe IKEA-acties te loggen.
      default: []
      selector:
        action: {}

trigger:
  - platform: mqtt
    topic: !input z2m_topic

condition: []

action:
  - variables:
      z2m_action: "{{ trigger.payload_json.action | default('') }}"
      z2m_payload: "{{ trigger.payload_json }}"
      z2m_brightness: "{{ trigger.payload_json.brightness | default(none) }}"
      z2m_delta: "{{ trigger.payload_json.action_brightness_delta | default(none) }}"

  - choose:
      - conditions: "{{ z2m_action | length > 0 }}"
        sequence: !input action_any

  - choose:
      - conditions: "{{ z2m_action == 'on' }}"
        sequence: !input action_on

      - conditions: "{{ z2m_action == 'off' }}"
        sequence: !input action_off

      - conditions: "{{ z2m_action == 'on_double' }}"
        sequence: !input action_on_double

      - conditions: "{{ z2m_action == 'off_double' }}"
        sequence: !input action_off_double

      - conditions: "{{ z2m_action == 'toggle' }}"
        sequence: !input action_toggle

      - conditions: "{{ z2m_action == 'toggle_hold' }}"
        sequence: !input action_toggle_hold

      - conditions: "{{ z2m_action == 'brightness_move_up' }}"
        sequence: !input action_brightness_move_up

      - conditions: "{{ z2m_action == 'brightness_move_down' }}"
        sequence: !input action_brightness_move_down

      - conditions: "{{ z2m_action == 'brightness_stop' }}"
        sequence: !input action_brightness_stop

      - conditions: "{{ z2m_action == 'brightness_step_up' }}"
        sequence: !input action_brightness_step_up

      - conditions: "{{ z2m_action == 'brightness_step_down' }}"
        sequence: !input action_brightness_step_down

      - conditions: "{{ z2m_action == 'brightness_move_to_level' }}"
        sequence: !input action_brightness_move_to_level

      - conditions: "{{ z2m_action == 'brightness_up_click' }}"
        sequence: !input action_brightness_up_click

      - conditions: "{{ z2m_action == 'brightness_up_hold' }}"
        sequence: !input action_brightness_up_hold

      - conditions: "{{ z2m_action == 'brightness_up_release' }}"
        sequence: !input action_brightness_up_release

      - conditions: "{{ z2m_action == 'brightness_down_click' }}"
        sequence: !input action_brightness_down_click

      - conditions: "{{ z2m_action == 'brightness_down_hold' }}"
        sequence: !input action_brightness_down_hold

      - conditions: "{{ z2m_action == 'brightness_down_release' }}"
        sequence: !input action_brightness_down_release

      - conditions: "{{ z2m_action == 'arrow_left_click' }}"
        sequence: !input action_arrow_left_click

      - conditions: "{{ z2m_action == 'arrow_left_hold' }}"
        sequence: !input action_arrow_left_hold

      - conditions: "{{ z2m_action == 'arrow_left_release' }}"
        sequence: !input action_arrow_left_release

      - conditions: "{{ z2m_action == 'arrow_right_click' }}"
        sequence: !input action_arrow_right_click

      - conditions: "{{ z2m_action == 'arrow_right_hold' }}"
        sequence: !input action_arrow_right_hold

      - conditions: "{{ z2m_action == 'arrow_right_release' }}"
        sequence: !input action_arrow_right_release

      - conditions: "{{ z2m_action in ['1_initial_press', 'dots_1_initial_press'] }}"
        sequence: !input action_button_1_initial_press

      - conditions: "{{ z2m_action in ['1_short_release', 'dots_1_short_release'] }}"
        sequence: !input action_button_1_short_release

      - conditions: "{{ z2m_action in ['1_long_press', 'dots_1_long_press'] }}"
        sequence: !input action_button_1_long_press

      - conditions: "{{ z2m_action in ['1_long_release', 'dots_1_long_release'] }}"
        sequence: !input action_button_1_long_release

      - conditions: "{{ z2m_action in ['1_double_press', 'dots_1_double_press'] }}"
        sequence: !input action_button_1_double_press

      - conditions: "{{ z2m_action in ['2_initial_press', 'dots_2_initial_press'] }}"
        sequence: !input action_button_2_initial_press

      - conditions: "{{ z2m_action in ['2_short_release', 'dots_2_short_release'] }}"
        sequence: !input action_button_2_short_release

      - conditions: "{{ z2m_action in ['2_long_press', 'dots_2_long_press'] }}"
        sequence: !input action_button_2_long_press

      - conditions: "{{ z2m_action in ['2_long_release', 'dots_2_long_release'] }}"
        sequence: !input action_button_2_long_release

      - conditions: "{{ z2m_action in ['2_double_press', 'dots_2_double_press'] }}"
        sequence: !input action_button_2_double_press

      - conditions: "{{ z2m_action == 'track_previous' }}"
        sequence: !input action_track_previous

      - conditions: "{{ z2m_action == 'track_next' }}"
        sequence: !input action_track_next

      - conditions: "{{ z2m_action == 'volume_up' }}"
        sequence: !input action_volume_up

      - conditions: "{{ z2m_action == 'volume_down' }}"
        sequence: !input action_volume_down

      - conditions: "{{ z2m_action == 'volume_up_hold' }}"
        sequence: !input action_volume_up_hold

      - conditions: "{{ z2m_action == 'volume_down_hold' }}"
        sequence: !input action_volume_down_hold

      - conditions: "{{ z2m_action == 'open' }}"
        sequence: !input action_open

      - conditions: "{{ z2m_action == 'close' }}"
        sequence: !input action_close

      - conditions: "{{ z2m_action == 'stop' }}"
        sequence: !input action_stop

    default:
      - choose:
          - conditions: "{{ z2m_action | length > 0 }}"
            sequence: !input action_unknown

mode: parallel
max: 20
max_exceeded: silent
